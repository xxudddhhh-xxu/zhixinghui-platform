services:
  postgres:
    image: postgres:16-alpine
    container_name: zxh-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: zhixinghui
    ports:
      - '5433:5432'
    volumes:
      - zxh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d zhixinghui']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zxh-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - zxh_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zxh-qdrant
    ports:
      - '6333:6333'
    volumes:
      - zxh_qdrantdata:/qdrant/storage

volumes:
  zxh_pgdata:
  zxh_redisdata:
  zxh_qdrantdata:
